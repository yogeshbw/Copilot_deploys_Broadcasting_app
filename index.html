<!DOCTYPE html>
<html>
<head>
  <title>PeerJS Broadcast/Listen App</title>
</head>
<body>
  <h2>Broadcast / Listen App</h2>

  <!-- Mode Selection -->
  <button id="broadcastMode">Broadcast Mode</button>
  <button id="listenMode">Listen Mode</button>

  <!-- Video Elements -->
  <div id="broadcastSection" style="display:none;">
    <h3>Broadcaster</h3>
    <video id="myVideo" autoplay muted></video>
    <button id="startBroadcast">Start Broadcast</button>
    <button id="startRecord">Start Recording</button>
    <button id="stopRecord">Stop Recording</button>
    <a id="downloadLink" href="#">Download Recording</a>
    <p>Your Peer ID: <span id="myPeerId"></span></p>
  </div>

  <div id="listenSection" style="display:none;">
    <h3>Viewer</h3>
    <input id="broadcasterId" placeholder="Enter Broadcaster Peer ID">
    <button id="connectBroadcast">Connect</button>
    <video id="remoteVideo" autoplay></video>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
